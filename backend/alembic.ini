# PetPal Alembic Configuration
# 数据库迁移管理配置文件

[alembic]
# 迁移脚本位置
script_location = alembic

# 模板文件使用
prepend_sys_path = .

# 迁移版本文件命名格式
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(slug)s
file_template = %%(rev)s_%%(slug)s

# 设置时区
timezone = Asia/Shanghai

# 是否截断revision哈希
truncate_slug_length = 40

# 设置新版本revision的初始化hook
# revision_environment = false

# 是否在运行迁移时检测源文件变化
# sourceless = false

# 版本路径分隔符（用于多数据库场景）
# version_path_separator = os

# 输出编码
output_encoding = utf-8

# 数据库URL（将被env.py中的动态配置覆盖）
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# 迁移文件生成后的钩子（可选：代码格式化）
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
